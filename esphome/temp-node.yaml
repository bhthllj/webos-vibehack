# ESPHome node: ESP32-C3 SuperMini + DS18B20 temperature probe + 0.96" SSD1306 OLED (I2C).
# Wiring (all sensors on the 3.3V pin, never 5V):
#   DS18B20  red -> 3V3, black -> GND, yellow/data -> GPIO4, plus a 4.7k resistor between data and 3V3
#   OLED     VCC -> 3V3, GND -> GND, SDA -> GPIO6, SCL -> GPIO7
#   Float switch (optional): one wire GPIO3, the other GND
# Build and flash:  esphome run temp-node.yaml   (copy secrets.yaml.example to secrets.yaml first)

substitutions:
  name: temp-node-1
  friendly_name: Temp Node 1

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1   # works for the SuperMini; ESPHome has no dedicated entry
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB         # SuperMini clones drop out at full power
  ap:                         # fallback hotspot if the Wi-Fi is unreachable
    ssid: "${name}"
    password: !secret ap_password

captive_portal:

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true                  # the log lists found devices: the OLED should show as 0x3C

one_wire:
  - platform: gpio
    pin: GPIO4                # the 1-Wire bus; the 4.7k pull-up goes on this line

sensor:
  - platform: dallas_temp
    name: "Temperature"
    id: temp
    update_interval: 30s
    filters:
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic

# Optional water-level float switch (on = water at the float, with the wire to GND).
# binary_sensor:
#   - platform: gpio
#     name: "Water level high"
#     pin:
#       number: GPIO3
#       mode: INPUT_PULLUP
#       inverted: true
#     filters:
#       - delayed_on_off: 2s    # ignore sloshing

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 28
  - file: "gfonts://Roboto"
    id: font_small
    size: 14

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled
    update_interval: 5s
    lambda: |-
      it.printf(0, 0, id(font_small), "${friendly_name}");
      if (id(temp).has_state()) {
        it.printf(0, 22, id(font_big), "%.1f °C", id(temp).state);
      } else {
        it.printf(0, 22, id(font_big), "--");
      }
